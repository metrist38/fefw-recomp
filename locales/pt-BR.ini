Ambient occlusion = Oclusão de ambiente
The soft shading in corners. Off saves GPU time everywhere, with flatter lighting. = O sombreamento suave nos cantos. Desligado economiza tempo de GPU em todo lugar, com uma iluminação mais chapada.

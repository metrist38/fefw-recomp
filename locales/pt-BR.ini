Mouse = Mouse
An output wider than 16:9 (21:9, 32:9, or a wide window with Output size = the window's size) widens the 3D view and keeps the menus, HUD, text and movies in the centred 16:9 area, after Kompas9's ultrawide patch. A narrower output (16:10) gets the 16:9 picture letterboxed. Off: the game's 16:9 picture is stretched to a wide output.	Uma saída mais larga que 16:9 (21:9, 32:9, ou uma janela larga com Tamanho de saída = o tamanho da janela) alarga a visão 3D e mantém os menus, o HUD, o texto e os vídeos na área 16:9 central, como no patch ultrawide de Kompas9. Uma saída mais estreita (16:10) recebe a imagem 16:9 com faixas. Desligado: a imagem 16:9 do jogo é esticada até a saída larga.
The 3D render size per side as a share of the output; the game's upscaler (Graphics > Upscaler) fills the rest. 100% renders at the output size and only anti-aliases. = O tamanho da renderização 3D em cada lado, como fração da saída; o upscaler do jogo (Gráficos > Upscaler) completa o resto. 100% renderiza no tamanho de saída e só faz antisserrilhamento.
The shadow map's base size. Larger is sharper and costs GPU time and memory (8192: about 1.3 GB more). = O tamanho base do mapa de sombras. Maior é mais nítido e custa tempo de GPU e memória (8192: cerca de 1,3 GB a mais).
Quality = Qualidade
Docked gives every render configuration the docked one's shadows and effects, so a handheld or 1080p answer keeps them. Handheld gives every one the handheld configuration's lighter shadows and effects, for a slower GPU. = Modo TV dá a todas as configurações de renderização as sombras e os efeitos do modo TV, para que uma resposta portátil ou 1080p os mantenha. Portátil dá a todas as sombras e os efeitos mais leves do modo portátil, para uma GPU mais lenta.
What answers the game's DLSS calls. TAAU needs nothing; DLSS needs an RTX GPU and the Streamline DLLs ([upscale] dlss_dll); FSR 3 runs on any GPU with AMD's FidelityFX DLLs (upscalers\fsr next to the launcher, or [upscale] fsr_dll); XeSS runs on any GPU with DP4a (best on Intel Arc) and needs libxess.dll (upscalers\xess next to the launcher, or [upscale] xess_dll) and the Visual C++ 2015-2022 runtime. One that cannot run falls back to TAAU and the log names the missing file. Choosing DLSS or XeSS (or Auto with the DLLs present) takes effect at the next start. = O que responde às chamadas de DLSS do jogo. O TAAU não precisa de nada; o DLSS precisa de uma GPU RTX e das DLLs do Streamline ([upscale] dlss_dll); o FSR 3 roda em qualquer GPU com as DLLs FidelityFX da AMD (upscalers\fsr ao lado do launcher, ou [upscale] fsr_dll); o XeSS roda em qualquer GPU com DP4a (melhor na Intel Arc) e precisa do libxess.dll (upscalers\xess ao lado do launcher, ou [upscale] xess_dll) e do runtime do Visual C++ 2015-2022. Um que não consiga rodar volta para o TAAU, e o log diz qual arquivo falta. Escolher DLSS ou XeSS (ou Automático com as DLLs presentes) vale a partir do próximo início.
FSR 3 sharpening = Nitidez do FSR 3
TAAU history = Histórico do TAAU
How much of the history TAAU keeps: higher is smoother and slower to follow change. = Quanto do histórico o TAAU mantém: maior é mais suave e demora mais para acompanhar mudanças.
One generated frame per rendered frame; the HUD is taken from the real frame. Keep vsync and low latency off. DLSS-G needs an RTX 40 or newer GPU, the Streamline DLLs (with the five frame generation adds) and Windows' hardware-accelerated GPU scheduling; FSR 3 runs on any GPU and needs amd_fidelityfx_vk.dll v1.1.4 (in upscalers\fsr next to the launcher). = Um quadro gerado por quadro renderizado; o HUD vem do quadro real. Mantenha VSync e baixa latência desligados. O DLSS-G precisa de uma GPU RTX 40 ou mais nova, das DLLs do Streamline (com os cinco extras de geração de quadros) e do agendamento de GPU acelerado por hardware do Windows; o FSR 3 roda em qualquer GPU e precisa do amd_fidelityfx_vk.dll v1.1.4 (em upscalers\fsr ao lado do launcher).
Keeps the game clock exact when frames are uneven: the game's step plus a quarter of the time it still owes. = Mantém o relógio do jogo exato quando os quadros são irregulares: o passo do jogo mais um quarto do tempo que ainda falta.
Mouse controls = Controles por mouse
Automatic: moving or clicking the mouse switches the game to its mouse controls, a key or the controller switches back. Always: the game stays in its mouse controls. Off: the game never sees a mouse. = Automático: mover ou clicar o mouse muda o jogo para os controles por mouse; uma tecla ou o controle volta ao normal. Sempre: o jogo fica nos controles por mouse. Desligado: o jogo nunca vê um mouse.
Mouse speed = Velocidade do mouse
How far the game's cursor and camera move per mouse count, before the game's own speed settings. = Quanto o cursor e a câmera do jogo se movem por contagem do mouse, antes das configurações de velocidade do próprio jogo.

Highlight saturation = Saturação dos realces
0 = the game's highlights, which turn white as they brighten; higher keeps the scene's own colour in bright highlights (fire, magic, sunsets). Below paper white nothing changes.	0 = os realces do jogo, que ficam brancos ao clarear; maior mantém a cor da própria cena nos realces claros (fogo, magia, pores do sol). Abaixo do branco de papel nada muda.
Hue preservation = Preservação de matiz
0 = the game's tone curve, which shifts strong colours as they brighten (orange toward yellow, deep blue toward cyan). Higher keeps the scene's own hues through the whole range. HDR.	0 = a curva de tons do jogo, que desloca as cores fortes ao clarear (laranja para amarelo, azul profundo para ciano). Maior mantém os matizes da própria cena em toda a faixa. HDR.
Wide colour = Cores amplas
HDR enhancement: keeps the colours the game itself renders beyond the standard range (it lights the scene in BT.2020), which SDR has to clip. Everything inside the standard range stays as in SDR. Off = SDR colours exactly.	Melhoria HDR: mantém as cores que o próprio jogo renderiza além da faixa padrão (ele ilumina a cena em BT.2020), que o SDR precisa cortar. Tudo dentro da faixa padrão fica como no SDR. Desligado = exatamente as cores SDR.
Dither output = Dithering na saída
Adds very fine noise before the picture goes to the display, hiding faint steps in smooth dark gradients (night skies, fades). = Adiciona um ruído bem fino antes de a imagem ir para a tela, escondendo degraus sutis em degradês escuros suaves (céus noturnos, transições).
Colour expansion = Expansão de cores
0 keeps the game's SDR colours exactly; higher pushes strongly saturated colours into the wider HDR range. Taste, not accuracy. = 0 mantém exatamente as cores SDR do jogo; maior leva cores muito saturadas para a faixa HDR mais ampla. Questão de gosto, não de fidelidade.
Scene grading = Correção de cor da cena
Needs the HDR scene (HDR on): the grading runs in the HDR tone map. In SDR use Picture below. = Precisa da cena HDR (HDR ligado): a correção roda no mapeamento de tons HDR. Em SDR, use Imagem abaixo.
Exposure = Exposição
Brightness of the 3D scene before the tone map, in stops. 0 = the game's.	Brilho da cena 3D antes do mapeamento de tons, em stops. 0 = o do jogo.
Scene contrast around mid grey, before the tone map. 1 = the game's.	Contraste da cena em torno do cinza médio, antes do mapeamento de tons. 1 = o do jogo.
Shadows = Sombras
Above 1 lifts the scene below mid grey, below 1 deepens it. 1 = the game's.	Acima de 1 clareia a cena abaixo do cinza médio, abaixo de 1 a escurece. 1 = o do jogo.
Highlights = Realces
Above 1 brightens the scene above mid grey, below 1 tames it. 1 = the game's.	Acima de 1 clareia a cena acima do cinza médio, abaixo de 1 a suaviza. 1 = o do jogo.
Scene colour intensity before the tone map (the UI is not touched). 1 = the game's.	Intensidade das cores da cena antes do mapeamento de tons (a interface não é alterada). 1 = a do jogo.
Post effects = Pós-efeitos
Bloom = Bloom
Strength of the game's glow around bright lights. 1 = the game's, 0 = none. SDR and HDR.	Intensidade do brilho do jogo em volta de luzes fortes. 1 = o do jogo, 0 = nenhum. SDR e HDR.
Sharpening = Nitidez
Strength of the game's own sharpening of the finished picture. 1 = the game's, 0 = none. SDR and HDR.	Intensidade da nitidez que o próprio jogo aplica à imagem final. 1 = a do jogo, 0 = nenhuma. SDR e HDR.
Motion blur = Desfoque de movimento
Strength of the game's camera motion blur. 1 = the game's, 0 = none, 2 = twice the blur length. SDR and HDR.	Intensidade do desfoque de movimento da câmera do jogo. 1 = o do jogo, 0 = nenhum, 2 = o dobro do rastro. SDR e HDR.
Depth of field = Profundidade de campo
Strength of the game's out-of-focus blur. 1 = the game's, 0 = everything sharp, 2 = a wider aperture: more blur, starting closer to the focus. SDR and HDR.	Intensidade do desfoque fora de foco do jogo. 1 = o do jogo, 0 = tudo nítido, 2 = uma abertura maior: mais desfoque, começando mais perto do foco. SDR e HDR.
Vignette = Vinheta
Strength of the darkened screen edges in the scenes that have one (the world map, some story scenes). 1 = the game's, 0 = none. SDR and HDR.	Intensidade das bordas escurecidas da tela nas cenas que as têm (o mapa-múndi, algumas cenas da história). 1 = a do jogo, 0 = nenhuma. SDR e HDR.
Compare with the game = Comparar com o jogo
Testing aid: the left half of the screen as the game draws it, the right half with your scene grading, highlight saturation and sharpening (HDR needed for grading and highlight saturation). = Ajuda para testes: a metade esquerda da tela como o jogo a desenha, a metade direita com a sua correção de cor da cena, saturação dos realces e nitidez (é preciso HDR para a correção e a saturação dos realces).
30 is the game's own. 60 runs gameplay at 60 at the right speed. 120 needs a frame limit of 120 or more and a fast PC. Frame-rate fixes below keep frame-counted effects at their 30 fps speed. = 30 é o padrão do jogo. 60 roda o jogo a 60 na velocidade certa. 120 precisa de um limite de quadros de 120 ou mais e de um PC rápido. As correções de taxa de quadros abaixo mantêm os efeitos contados por quadro na velocidade de 30 fps.

# Pause
Pause = Pausa
Pause while this menu is open = Pausar enquanto este menu estiver aberto
Freezes the game, cutscenes, movies and audio while the F1 menu is open. [tweaks] pause_in_menu in controls.ini. = Congela o jogo, cutscenes, filmes e áudio enquanto o menu F1 estiver aberto. [tweaks] pause_in_menu em controls.ini.
Pause in the background = Pausar em segundo plano
Freezes the game, cutscenes, movies and audio while the window is not in focus (Alt+Tab, Steam menu, Quick Access). [tweaks] pause_unfocused in controls.ini. = Congela o jogo, cutscenes, filmes e áudio enquanto a janela não estiver em foco (Alt+Tab, menu Steam, Acesso Rápido). [tweaks] pause_unfocused em controls.ini.

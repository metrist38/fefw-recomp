Sets Render scale, Shadow resolution, Quality and the four detail settings together. Low is for a slower GPU or a handheld PC; Medium is the console's picture (the defaults); High and Ultra render sharper. Output size and the upscaler are not changed; a fixed render size is cleared. = Define juntos a Escala de renderização, a Resolução das sombras, a Qualidade e as quatro opções de detalhe. Baixo é para uma GPU mais lenta ou um PC portátil; Médio é a imagem do console (o padrão); Alto e Ultra renderizam com mais nitidez. O tamanho de saída e o upscaler não mudam; um tamanho de renderização fixo é apagado.

# --- row help texts ---
0 keeps the SDR look, 1 lets highlights reach the peak, 2 pushes them further. = 0 mantém o visual SDR, 1 deixa os realces chegarem ao pico, 2 os leva além.
Nits of white in menus, text and the HUD while the 3D scene keeps paper white; 0 = same as paper white. HDR output only.	Nits do branco nos menus, no texto e no HUD, enquanto a cena 3D mantém o branco de papel; 0 = igual ao branco de papel. Só com saída HDR.
same as paper white = igual ao branco de papel
1 is the sharpest. = 1 é o mais nítido.
A log line with the game clock's speed every this many seconds ([fefw] clock_log); 0 is off. = Uma linha de log com a velocidade do relógio do jogo a cada tantos segundos ([fefw] clock_log); 0 desliga.
A small frame rate counter in a corner. The hotkey flips it in the game. = Um pequeno contador de quadros num canto. A tecla de atalho o liga e desliga no jogo.
Analog trigger travel that counts as ZL / ZR pressed. = Curso do gatilho analógico que conta como ZL / ZR apertado.
Borderless fullscreen keeps the desktop resolution and switches at once; exclusive takes over the display. Alt+Enter flips windowed and fullscreen. = Tela cheia sem bordas mantém a resolução da área de trabalho e alterna na hora; a exclusiva assume a tela. Alt+Enter alterna entre janela e tela cheia.
By label: the button printed A is the Switch A (Xbox layout). By position: the bottom button is the Switch B, as on a Switch pad. = Pela letra: o botão marcado A é o A do Switch (disposição do Xbox). Pela posição: o botão de baixo é o B do Switch, como num controle de Switch.
Everything the game plays. = Tudo o que o jogo toca.
HDR10 or scRGB; Auto picks HDR10 when the display offers it. = HDR10 ou scRGB; Automático escolhe HDR10 quando a tela o oferece.
How far the stick moves before it counts, as a share of its travel. = Quanto o analógico se move antes de contar, como fração do curso.
How the game's output (Graphics > Output size) is scaled to the window when they differ. FSR 1 and NIS sharpen while they enlarge; a smaller window is always averaged. = Como a saída do jogo (Gráficos > Tamanho de saída) é ajustada à janela quando eles diferem. FSR 1 e NIS dão nitidez ao ampliar; uma janela menor sempre usa média.
Lower it if the stick never reaches full speed (it tops out early). = Diminua se o analógico nunca chegar à velocidade máxima (ele chega ao limite cedo).
NVIDIA Reflex or AMD Anti-Lag 2, whichever the GPU has. Keep it off with frame generation. = NVIDIA Reflex ou AMD Anti-Lag 2, o que a GPU tiver. Mantenha desligado com geração de quadros.
Off keeps SDR; Auto uses HDR when the display and Windows offer it; On runs the HDR pipeline anyway; Native uses the levels the game declares for an HDR TV. = Desligado mantém SDR; Automático usa HDR quando a tela e o Windows o oferecem; Ligado roda o pipeline HDR mesmo assim; Nativo usa os níveis que o jogo declara para uma TV HDR.
Off stretches the picture to the window. = Desligado estica a imagem até a janela.
Off: no forced vsync, the lowest latency; works with G-Sync / FreeSync and the frame limit. On: the display paces. = Desligado: sem VSync forçado, a menor latência; funciona com G-Sync / FreeSync e o limite de quadros. Ligado: a tela dita o ritmo.
One line of Reflex / Anti-Lag timings a second ([latency] log_timings in controls.ini). = Uma linha por segundo com os tempos do Reflex / Anti-Lag ([latency] log_timings no controls.ini).
Refresh rate follows the display. The game's own pace (30 / 60 / 120) still holds under it. = Taxa de atualização segue a tela. O ritmo do próprio jogo (30 / 60 / 120) continua valendo abaixo dela.
Screenshots leave the counter out unless this is on. = As capturas de tela deixam o contador de fora, a menos que isto esteja ligado.
Silent while the window is not in focus. = Sem som enquanto a janela não estiver em foco.
The client size in windowed mode. It changes at once while windowed; in fullscreen it is the size the window goes back to. = O tamanho da área útil no modo janela. Muda na hora no modo janela; em tela cheia, é o tamanho ao qual a janela volta.
The display the window moves to; the fullscreen modes use it. = A tela para a qual a janela vai; os modos de tela cheia a usam.
The game opens its audio device once. = O jogo abre o dispositivo de áudio uma única vez.
The language of the game's text and voices. Automatic uses your Windows display language when the game has it, else English. It applies the next time the game starts. [tweaks] language in controls.ini; [system] language in fefw.ini wins over it. = O idioma dos textos e das vozes do jogo. Automático usa o idioma de exibição do Windows quando o jogo o tem; senão, inglês. Vale a partir da próxima vez que o jogo iniciar. [tweaks] language no controls.ini; [system] language no fefw.ini tem prioridade.
The lowest level written to the log ([log] level). = O nível mais baixo gravado no log ([log] level).
The same for the right stick (the camera). = O mesmo para o analógico direito (a câmera).
The size the game renders its picture, UI and post effects at (its DLSS output). Up to 3840 x 2160 at 16:9, or 5120 x 2160 for wider shapes, which need Ultrawide. The window scales it (Display > Scaling to the window). = O tamanho em que o jogo renderiza a imagem, a interface e os pós-efeitos (a saída do DLSS dele). Até 3840 x 2160 em 16:9, ou 5120 x 2160 para formatos mais largos, que precisam de Ultrawide. A janela a ajusta (Tela > Escala para a janela).
Which button icons the game shows ([prompts] style). = Quais ícones de botão o jogo mostra ([prompts] style).
[fps] key in controls.ini. = [fps] key no controls.ini.


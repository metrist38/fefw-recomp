Reduced: scenery switches to its simpler versions at 60% of the distance (50 m becomes 30 m). = Reduzido: o cenário passa para as versões mais simples mais cedo, a 60% (50 m viram 30 m).
NPC limit = Limite de NPCs
How many townspeople a town shows. The game keeps at most 70 different NPC models loaded, shows them within 80 m and under a draw budget; past those limits townspeople are hidden, even close by, and pop in as you walk. This multiplies all three. More memory and CPU work. Console = exactly the game's behaviour.	Quantos moradores uma cidade mostra. O jogo mantém no máximo 70 modelos de NPC diferentes carregados e os mostra a até 80 m e dentro de um orçamento de desenho; além desses limites, os moradores ficam ocultos, mesmo de perto, e surgem enquanto você anda. Isto multiplica os três. Mais memória e trabalho de CPU. Console = exatamente o comportamento do jogo.

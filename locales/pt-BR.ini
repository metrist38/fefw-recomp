The neural network DLSS runs. The transformer models (K, J, L, M) look best; L and M are the second generation, M the faster of them. Default lets the DLSS file decide (K at full render size). A DLSS file without the chosen model uses its default. Applies at once. = A rede neural que o DLSS roda. Os modelos transformer (K, J, L, M) ficam melhores; L e M são a segunda geração, e M o mais rápido deles. Padrão deixa o arquivo do DLSS decidir (K no tamanho de renderização completo). Um arquivo do DLSS sem o modelo escolhido usa o padrão dele. Vale na hora.

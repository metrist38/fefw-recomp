Sets Render scale, Shadow resolution, Quality and the four detail settings together. Low is for a slower GPU or a handheld PC; Medium is the console's picture (the defaults); High and Ultra render sharper. Output size and the upscaler are not changed; a fixed render size is cleared. = يضبط مقياس التصيير ودقة الظلال والجودة وإعدادات التفاصيل الأربعة معًا. المنخفض لمعالج رسوميات أبطأ أو حاسوب محمول باليد، والمتوسط هو صورة المنصة (الافتراضي)، والمرتفع والفائق يصيّران بوضوح أكبر. لا يتغير حجم المخرج ولا رافع الدقة، ويُمسح حجم التصيير الثابت.
Handheld quality in every config (lighter) = جودة الوضع المحمول في كل الإعدادات (أخف)
Graphics detail = تفاصيل الرسوميات
The game's own graphics settings and limits, changed as the game loads them: these apply on restart. = إعدادات الرسوميات وحدودها الخاصة باللعبة، تتغير عند تحميل اللعبة لها، لذا تُطبَّق بعد إعادة التشغيل.
Reflections = الانعكاسات
Full = كامل
Reduced = مخفّض
Reduced (8 rays, a little grainier) = مخفّض (8 أشعة، تحبّب أكثر قليلًا)
Screen-space reflections on floors and water. Reduced takes 8 rays instead of 32 and mostly helps in the hubs. = انعكاسات مساحة الشاشة على الأرضيات والماء. المخفّض يستخدم 8 أشعة بدلًا من 32، ويفيد غالبًا في المراكز.
Ambient occlusion = الإطباق المحيطي
The soft shading in corners. Off saves GPU time everywhere, with flatter lighting. = التظليل الناعم في الزوايا. إيقافه يوفّر وقت معالج الرسوميات في كل مكان، مع إضاءة أكثر تسطحًا.
Crowd detail = تفاصيل الحشود
Reduced: crowd characters switch to their simpler models twice as soon, lightening busy towns and battles. = المخفّض: تنتقل شخصيات الحشود إلى نماذجها الأبسط في ضعف السرعة، فتخف المدن والمعارك المزدحمة.
Scenery detail = تفاصيل المناظر
Reduced: scenery switches to its simpler versions at 60% of the distance (50 m becomes 30 m). = المخفّض: تنتقل المناظر إلى نسخها الأبسط عند 60 بالمئة من المسافة (50 م تصبح 30 م).
NPC limit = حد الشخصيات غير القابلة للعب
How many townspeople a town shows. The game keeps at most 70 different NPC models loaded, shows them within 80 m and under a draw budget; past those limits townspeople are hidden, even close by, and pop in as you walk. This multiplies all three. More memory and CPU work. Console = exactly the game's behaviour.	عدد سكان المدينة الذين تعرضهم المدينة. تُبقي اللعبة 70 نموذجًا مختلفًا كحد أقصى محمّلة، وتعرضها ضمن 80 م وتحت ميزانية رسم، وبعد هذه الحدود يختفي السكان حتى القريبون منهم، ثم يظهرون فجأة أثناء سيرك. هذا الخيار يضاعف الحدود الثلاثة. ذاكرة وعمل معالج أكثر. المنصة = سلوك اللعبة تمامًا.

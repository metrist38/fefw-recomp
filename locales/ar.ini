J (transformer) = J (محوِّل)
L (transformer, 2nd generation) = L (محوِّل، الجيل الثاني)
M (transformer, 2nd generation, faster) = M (محوِّل، الجيل الثاني، أسرع)
1 (sharpest) = 1 (الأشد حدة)
6 (sharper in motion) = 6 (أوضح أثناء الحركة)

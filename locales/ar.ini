Spreads the tones from mid grey; 1 is the game's own.	يباعد الدرجات عن الرمادي المتوسط، و1 = قيمة اللعبة.
Colour intensity; 0 is grey, 1 the game's own.	شدة الألوان، و0 = رمادي، و1 = قيمة اللعبة.
Below 0 pulls dark tones to black, above 0 lifts them. = تحت 0 يسحب الدرجات الداكنة نحو الأسود، وفوق 0 يرفعها.
Mid-tone brightness: above 1 brightens. = سطوع الدرجات المتوسطة: فوق 1 يزيد السطوع.
Neutral is the game's own picture; Vivid adds a little contrast and colour. = المحايد هو صورة اللعبة الأصلية، والحيوي يضيف قليلًا من التباين والألوان.
Mouse = الفأرة
An output wider than 16:9 (21:9, 32:9, or a wide window with Output size = the window's size) widens the 3D view and keeps the menus, HUD, text and movies in the centred 16:9 area, after Kompas9's ultrawide patch. A narrower output (16:10) gets the 16:9 picture letterboxed. Off: the game's 16:9 picture is stretched to a wide output.	المخرج الأعرض من 16:9 (21:9 أو 32:9 أو نافذة عريضة مع حجم المخرج = حجم النافذة) يوسّع المشهد ثلاثي الأبعاد ويُبقي القوائم والواجهة والنصوص والمقاطع في منطقة 16:9 الوسطى، اعتمادًا على رقعة Kompas9 للشاشات فائقة العرض. والمخرج الأضيق (16:10) يعرض صورة 16:9 مع أشرطة سوداء. عند الإيقاف: تُمَطّ صورة اللعبة 16:9 على المخرج العريض.
The 3D render size per side as a share of the output; the game's upscaler (Graphics > Upscaler) fills the rest. 100% renders at the output size and only anti-aliases. = حجم التصيير ثلاثي الأبعاد لكل بُعد كنسبة من المخرج، ويكمل رافع الدقة في اللعبة (الرسوميات > رافع الدقة) الباقي. عند 100 بالمئة يكون التصيير بحجم المخرج مع تنعيم الحواف فقط.
The shadow map's base size. Larger is sharper and costs GPU time and memory (8192: about 1.3 GB more). = الحجم الأساسي لخريطة الظلال. الأكبر أوضح ويستهلك وقتًا وذاكرة من معالج الرسوميات (8192: نحو 1.3 GB إضافية).
Quality = الجودة
Docked gives every render configuration the docked one's shadows and effects, so a handheld or 1080p answer keeps them. Handheld gives every one the handheld configuration's lighter shadows and effects, for a slower GPU. = خيار وضع القاعدة يمنح كل إعدادات التصيير ظلال وضع القاعدة ومؤثراته، فيحتفظ بها اختيار الوضع المحمول أو 1080p. وخيار الوضع المحمول يمنحها كلها ظلال الوضع المحمول ومؤثراته الأخف، لمعالج رسوميات أبطأ.
What answers the game's DLSS calls. TAAU needs nothing; DLSS needs an RTX GPU and the Streamline DLLs ([upscale] dlss_dll); FSR 3 runs on any GPU with AMD's FidelityFX DLLs (upscalers\fsr next to the launcher, or [upscale] fsr_dll); XeSS runs on any GPU with DP4a (best on Intel Arc) and needs libxess.dll (upscalers\xess next to the launcher, or [upscale] xess_dll) and the Visual C++ 2015-2022 runtime. One that cannot run falls back to TAAU and the log names the missing file. Choosing DLSS or XeSS (or Auto with the DLLs present) takes effect at the next start. = ما يستجيب لاستدعاءات DLSS في اللعبة. لا يحتاج TAAU إلى شيء، ويحتاج DLSS إلى معالج RTX وملفات Streamline DLL ([upscale] dlss_dll)، ويعمل FSR 3 على أي معالج رسوميات مع ملفات FidelityFX DLL من AMD (upscalers\fsr بجوار المشغّل، أو [upscale] fsr_dll)، ويعمل XeSS على أي معالج رسوميات يدعم DP4a (والأفضل Intel Arc) ويحتاج إلى libxess.dll (upscalers\xess بجوار المشغّل، أو [upscale] xess_dll) وبيئة تشغيل Visual C++ 2015-2022. ما يتعذّر تشغيله يعود إلى TAAU ويذكر السجل الملف الناقص. اختيار DLSS أو XeSS (أو التلقائي مع وجود الملفات) يسري عند البدء التالي.
FSR 3 sharpening = حدة FSR 3
TAAU history = سجل TAAU
How much of the history TAAU keeps: higher is smoother and slower to follow change. = مقدار ما يحتفظ به TAAU من الإطارات السابقة: الأعلى أنعم وأبطأ في مواكبة التغيير.
One generated frame per rendered frame; the HUD is taken from the real frame. Keep vsync and low latency off. DLSS-G needs an RTX 40 or newer GPU, the Streamline DLLs (with the five frame generation adds) and Windows' hardware-accelerated GPU scheduling; FSR 3 runs on any GPU and needs amd_fidelityfx_vk.dll v1.1.4 (in upscalers\fsr next to the launcher). = إطار مولَّد واحد لكل إطار مصيَّر، وتؤخذ الواجهة من الإطار الحقيقي. أبقِ V-Sync وزمن الاستجابة المنخفض متوقفين. يتطلب DLSS-G معالج RTX 40 أو أحدث، وملفات Streamline DLL (مع إضافات توليد الإطارات الخمس)، وجدولة GPU المسرَّعة بالعتاد في Windows. ويعمل FSR 3 على أي معالج رسوميات ويحتاج إلى amd_fidelityfx_vk.dll v1.1.4 (في upscalers\fsr بجوار المشغّل).
Keeps the game clock exact when frames are uneven: the game's step plus a quarter of the time it still owes. = تُبقي ساعة اللعبة دقيقة حين تتفاوت الإطارات: خطوة اللعبة مضافًا إليها ربع الوقت الذي ما زالت تدين به.
Mouse controls = تحكم الفأرة
Automatic: moving or clicking the mouse switches the game to its mouse controls, a key or the controller switches back. Always: the game stays in its mouse controls. Off: the game never sees a mouse. = تلقائي: تحريك الفأرة أو النقر بها ينقل اللعبة إلى تحكم الفأرة، ومفتاح أو يد التحكم يعيدانها. دائمًا: تبقى اللعبة في تحكم الفأرة. إيقاف: لا ترى اللعبة أي فأرة.
Mouse speed = سرعة الفأرة
How far the game's cursor and camera move per mouse count, before the game's own speed settings. = مقدار حركة مؤشر اللعبة والكاميرا لكل وحدة حركة من الفأرة، قبل إعدادات السرعة الخاصة باللعبة.
Wake distance = مسافة التنبيه
How far the mouse must move (counts, within a quarter second) to switch to mouse controls. = المسافة التي يجب أن تتحركها الفأرة (بالوحدات، خلال ربع ثانية) للانتقال إلى تحكم الفأرة.
Capture the mouse = حبس الفأرة
While the game is in its mouse controls the Windows pointer is hidden and held in the window (the game draws its own cursor). A key, the controller, Alt+Tab or F1 frees it. = ما دامت اللعبة في تحكم الفأرة، يُخفى مؤشر Windows ويُحبس داخل النافذة (اللعبة ترسم مؤشرها الخاص). يحرّره أي مفتاح أو يد التحكم أو Alt+Tab أو F1.
Now = الآن
Left / right or A to change. = يسار / يمين أو A للتغيير.

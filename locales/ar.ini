The neural network DLSS runs. The transformer models (K, J, L, M) look best; L and M are the second generation, M the faster of them. Default lets the DLSS file decide (K at full render size). A DLSS file without the chosen model uses its default. Applies at once. = الشبكة العصبية التي يشغّلها DLSS. نماذج المحوِّل (K وJ وL وM) هي الأفضل مظهرًا، وL وM من الجيل الثاني وM أسرعهما. الافتراضي يترك القرار لملف DLSS (K عند حجم التصيير الكامل). ملف DLSS الذي لا يتضمن النموذج المختار يستخدم افتراضيه. يُطبَّق فورًا.

Stereo, or 5.1 surround (front left and right, centre, LFE, rear left and right). Windows downmixes 5.1 on a stereo device, so pick 5.1 only for a 5.1 or 7.1 output. [audio] channels in fefw.ini or NXRT_AUDIO_CHANNELS wins over this. = ستيريو، أو محيطي 5.1 (الأمامي الأيسر والأيمن، والوسط، وLFE، والخلفي الأيسر والأيمن). يدمج Windows صوت 5.1 على جهاز ستيريو، فاختر 5.1 فقط لمخرج 5.1 أو 7.1. المفتاح [audio] channels في fefw.ini أو NXRT_AUDIO_CHANNELS يتقدّم على هذا الخيار.

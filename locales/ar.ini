Nits of ordinary white; 0 = Windows' SDR content brightness (203 without it).	سطوع الأبيض العادي بالنِّت، و0 = سطوع محتوى SDR في Windows (203 إن لم يوجد).
Nits of the brightest highlights; 0 = what the display reports.	سطوع أشد الإضاءات بالنِّت، و0 = ما تُبلغ عنه الشاشة.
Not installed: the output is 16:9 or narrower, or [fefw] ultrawide = off.	غير مثبّت: المخرج بنسبة 16:9 أو أضيق، أو [fefw] ultrawide = off.

0 keeps the SDR look, 1 lets highlights reach the peak, 2 pushes them further. = 0 يحافظ على مظهر SDR، و1 يُبلغ الإضاءات الذروة، و2 يدفعها أبعد.
Nits of white in menus, text and the HUD while the 3D scene keeps paper white; 0 = same as paper white. HDR output only.	سطوع الأبيض بالنِّت في القوائم والنصوص والواجهة بينما يبقى المشهد ثلاثي الأبعاد على الأبيض المرجعي، و0 = مثل الأبيض المرجعي. لإخراج HDR فقط.
same as paper white = مثل الأبيض المرجعي
1 is the sharpest. = القيمة 1 هي الأشد حدة.
A log line with the game clock's speed every this many seconds ([fefw] clock_log); 0 is off.	سطر في السجل بسرعة ساعة اللعبة كل هذا العدد من الثواني ([fefw] clock_log)، و0 = إيقاف.
A small frame rate counter in a corner. The hotkey flips it in the game. = عدّاد صغير لمعدل الإطارات في إحدى الزوايا. يبدّله مفتاح الاختصار داخل اللعبة.
Analog trigger travel that counts as ZL / ZR pressed. = مقدار ضغط الزناد التناظري الذي يُحتسب ضغطًا على ZL / ZR.
Borderless fullscreen keeps the desktop resolution and switches at once; exclusive takes over the display. Alt+Enter flips windowed and fullscreen. = ملء الشاشة بلا حواف يحتفظ بدقة سطح المكتب ويتبدّل فورًا، أما الحصري فيستحوذ على الشاشة. يبدّل Alt+Enter بين النافذة وملء الشاشة.
By label: the button printed A is the Switch A (Xbox layout). By position: the bottom button is the Switch B, as on a Switch pad. = حسب التسمية: الزر المطبوع عليه A هو A في Switch (تخطيط Xbox). حسب الموضع: الزر السفلي هو B في Switch، كما في يد Switch.
Everything the game plays. = كل ما تشغّله اللعبة.
HDR10 or scRGB; Auto picks HDR10 when the display offers it. = HDR10 أو scRGB، ويختار التلقائي HDR10 حين تتيحه الشاشة.
How far the stick moves before it counts, as a share of its travel. = مقدار تحريك العصا قبل احتسابه، كنسبة من مداها.
How the game's output (Graphics > Output size) is scaled to the window when they differ. FSR 1 and NIS sharpen while they enlarge; a smaller window is always averaged. = طريقة تحجيم مخرج اللعبة (الرسوميات > حجم المخرج) ليلائم النافذة عند اختلافهما. يزيد FSR 1 وNIS الحدة أثناء التكبير، والنافذة الأصغر تُصغَّر دائمًا بالمتوسط.
Lower it if the stick never reaches full speed (it tops out early). = اخفضها إذا لم تبلغ العصا السرعة القصوى أبدًا (تتوقف مبكرًا).
NVIDIA Reflex or AMD Anti-Lag 2, whichever the GPU has. Keep it off with frame generation. = NVIDIA Reflex أو AMD Anti-Lag 2، أيهما يتوفر في معالج الرسوميات. أبقِه متوقفًا مع توليد الإطارات.
Off keeps SDR; Auto uses HDR when the display and Windows offer it; On runs the HDR pipeline anyway; Native uses the levels the game declares for an HDR TV. = الإيقاف يُبقي SDR، والتلقائي يستخدم HDR حين تتيحه الشاشة وWindows، والتشغيل يشغّل مسار HDR في كل الأحوال، والأصلي يستخدم المستويات التي تعلنها اللعبة لتلفاز HDR.
Off stretches the picture to the window. = عند الإيقاف تُمَطّ الصورة لتملأ النافذة.
Off: no forced vsync, the lowest latency; works with G-Sync / FreeSync and the frame limit. On: the display paces. = الإيقاف: بلا مزامنة رأسية إجبارية، وأقل زمن استجابة، ويعمل مع G-Sync / FreeSync وحد الإطارات. التشغيل: الشاشة تضبط الإيقاع.
One line of Reflex / Anti-Lag timings a second ([latency] log_timings in controls.ini). = سطر كل ثانية بتوقيتات Reflex / Anti-Lag ([latency] log_timings في controls.ini).
Refresh rate follows the display. The game's own pace (30 / 60 / 120) still holds under it. = خيار تردد الشاشة يتبع الشاشة. ويبقى إيقاع اللعبة الخاص (30 / 60 / 120) ساريًا تحته.
Screenshots leave the counter out unless this is on. = لا يظهر العدّاد في لقطات الشاشة ما لم يُفعَّل هذا الخيار.
Silent while the window is not in focus. = صامت ما دامت النافذة غير نشطة.
The client size in windowed mode. It changes at once while windowed; in fullscreen it is the size the window goes back to. = حجم منطقة العرض في وضع النافذة. يتغير فورًا في وضع النافذة، وفي ملء الشاشة هو الحجم الذي تعود إليه النافذة.
The display the window moves to; the fullscreen modes use it. = الشاشة التي تنتقل إليها النافذة، وتستخدمها أوضاع ملء الشاشة.
The game opens its audio device once. = تفتح اللعبة جهاز الصوت مرة واحدة.
The language of the game's text and voices. Automatic uses your Windows display language when the game has it, else English. It applies the next time the game starts. [tweaks] language in controls.ini; [system] language in fefw.ini wins over it. = لغة نصوص اللعبة وأصواتها. يستخدم التلقائي لغة عرض Windows إن كانت متوفرة في اللعبة، وإلا الإنجليزية. يُطبَّق عند تشغيل اللعبة في المرة التالية. المفتاح [tweaks] language في controls.ini، والمفتاح [system] language في fefw.ini يتقدّم عليه.
The lowest level written to the log ([log] level). = أدنى مستوى يُكتب في السجل ([log] level).
The same for the right stick (the camera). = الأمر نفسه للعصا اليمنى (الكاميرا).
The size the game renders its picture, UI and post effects at (its DLSS output). Up to 3840 x 2160 at 16:9, or 5120 x 2160 for wider shapes, which need Ultrawide. The window scales it (Display > Scaling to the window). = الحجم الذي تصيّر به اللعبة صورتها وواجهتها ومؤثراتها اللاحقة (مخرج DLSS). يصل إلى 3840 x 2160 بنسبة 16:9، أو 5120 x 2160 للنسب الأعرض التي تتطلب الشاشة فائقة العرض. تحجّمه النافذة (العرض > التحجيم إلى النافذة).
Which button icons the game shows ([prompts] style). = رموز الأزرار التي تعرضها اللعبة ([prompts] style).
[fps] key in controls.ini. = المفتاح [fps] في controls.ini.

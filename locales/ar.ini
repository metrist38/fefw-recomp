Highlight saturation = تشبع الإضاءات
0 = the game's highlights, which turn white as they brighten; higher keeps the scene's own colour in bright highlights (fire, magic, sunsets). Below paper white nothing changes.	0 = إضاءات اللعبة كما هي، وتبيضّ كلما ازدادت سطوعًا، والأعلى يحفظ ألوان المشهد في الإضاءات الساطعة (النار والسحر والغروب). لا يتغير شيء تحت الأبيض المرجعي.
Hue preservation = الحفاظ على تدرج اللون
0 = the game's tone curve, which shifts strong colours as they brighten (orange toward yellow, deep blue toward cyan). Higher keeps the scene's own hues through the whole range. HDR.	0 = منحنى الدرجات في اللعبة، الذي يزيح الألوان القوية كلما سطعت (البرتقالي نحو الأصفر، والأزرق الداكن نحو السماوي). والأعلى يحفظ تدرجات ألوان المشهد على المدى كله. HDR.
Wide colour = ألوان واسعة
HDR enhancement: keeps the colours the game itself renders beyond the standard range (it lights the scene in BT.2020), which SDR has to clip. Everything inside the standard range stays as in SDR. Off = SDR colours exactly.	تحسين HDR: يحفظ الألوان التي تصيّرها اللعبة نفسها خارج النطاق القياسي (فهي تضيء المشهد في BT.2020)، والتي يضطر SDR إلى قصّها. كل ما داخل النطاق القياسي يبقى كما في SDR. الإيقاف = ألوان SDR تمامًا.
Dither output = تنعيم الإخراج بالتشويش
Adds very fine noise before the picture goes to the display, hiding faint steps in smooth dark gradients (night skies, fades). = يضيف تشويشًا دقيقًا جدًا قبل إرسال الصورة إلى الشاشة، فيخفي الدرجات الباهتة في التدرجات الداكنة الناعمة (سماء الليل، والتلاشي).
Colour expansion = توسيع الألوان
0 keeps the game's SDR colours exactly; higher pushes strongly saturated colours into the wider HDR range. Taste, not accuracy. = 0 يحفظ ألوان SDR في اللعبة تمامًا، والأعلى يدفع الألوان شديدة التشبع إلى نطاق HDR الأوسع. مسألة ذوق لا دقة.
Scene grading = تدريج المشهد
Needs the HDR scene (HDR on): the grading runs in the HDR tone map. In SDR use Picture below. = يتطلب مشهد HDR (تشغيل HDR): يجري التدريج في تعيين درجات HDR. في SDR استخدم قسم الصورة أدناه.
Exposure = التعريض
Brightness of the 3D scene before the tone map, in stops. 0 = the game's.	سطوع المشهد ثلاثي الأبعاد قبل تعيين الدرجات، بوحدات stop. القيمة 0 = قيمة اللعبة.
Scene contrast around mid grey, before the tone map. 1 = the game's.	تباين المشهد حول الرمادي المتوسط، قبل تعيين الدرجات. القيمة 1 = قيمة اللعبة.
Shadows = الظلال
Above 1 lifts the scene below mid grey, below 1 deepens it. 1 = the game's.	فوق 1 يرفع سطوع المشهد تحت الرمادي المتوسط، وتحت 1 يعمّقه. القيمة 1 = قيمة اللعبة.
Highlights = الإضاءات
Above 1 brightens the scene above mid grey, below 1 tames it. 1 = the game's.	فوق 1 يزيد سطوع المشهد فوق الرمادي المتوسط، وتحت 1 يهدّئه. القيمة 1 = قيمة اللعبة.
Scene colour intensity before the tone map (the UI is not touched). 1 = the game's.	شدة ألوان المشهد قبل تعيين الدرجات (لا تتأثر الواجهة). القيمة 1 = قيمة اللعبة.
Post effects = المؤثرات اللاحقة
Bloom = التوهج
Strength of the game's glow around bright lights. 1 = the game's, 0 = none. SDR and HDR.	قوة توهج اللعبة حول الأضواء الساطعة. 1 = قيمة اللعبة، و0 = بلا توهج. في SDR وHDR.
Sharpening = زيادة الحدة
Strength of the game's own sharpening of the finished picture. 1 = the game's, 0 = none. SDR and HDR.	قوة زيادة الحدة التي تطبّقها اللعبة على الصورة النهائية. 1 = قيمة اللعبة، و0 = بلا زيادة. في SDR وHDR.
Motion blur = ضبابية الحركة
Strength of the game's camera motion blur. 1 = the game's, 0 = none, 2 = twice the blur length. SDR and HDR.	قوة ضبابية حركة الكاميرا في اللعبة. 1 = قيمة اللعبة، و0 = بلا ضبابية، و2 = ضعف طول الضبابية. في SDR وHDR.
Depth of field = عمق الميدان
Strength of the game's out-of-focus blur. 1 = the game's, 0 = everything sharp, 2 = a wider aperture: more blur, starting closer to the focus. SDR and HDR.	قوة ضبابية المناطق خارج التركيز في اللعبة. 1 = قيمة اللعبة، و0 = كل شيء واضح، و2 = فتحة عدسة أوسع: ضبابية أكثر تبدأ أقرب إلى نقطة التركيز. في SDR وHDR.
Vignette = التعتيم الطرفي
Strength of the darkened screen edges in the scenes that have one (the world map, some story scenes). 1 = the game's, 0 = none. SDR and HDR.	قوة تعتيم حواف الشاشة في المشاهد التي تحتوي عليه (خريطة العالم وبعض مشاهد القصة). 1 = قيمة اللعبة، و0 = بلا تعتيم. في SDR وHDR.
Compare with the game = المقارنة مع اللعبة
Testing aid: the left half of the screen as the game draws it, the right half with your scene grading, highlight saturation and sharpening (HDR needed for grading and highlight saturation). = أداة اختبار: النصف الأيسر من الشاشة كما ترسمه اللعبة، والنصف الأيمن مع تدريج المشهد وتشبع الإضاءات وزيادة الحدة التي اخترتها (يلزم HDR للتدريج وتشبع الإضاءات).
30 is the game's own. 60 runs gameplay at 60 at the right speed. 120 needs a frame limit of 120 or more and a fast PC. Frame-rate fixes below keep frame-counted effects at their 30 fps speed. = 30 هو معدل اللعبة الأصلي. و60 يشغّل اللعب بمعدل 60 بالسرعة الصحيحة. و120 يحتاج إلى حد إطارات 120 أو أكثر وحاسوب سريع. إصلاحات معدل الإطارات أدناه تُبقي المؤثرات المحسوبة بالإطارات على سرعتها عند 30 fps.
Frame-rate fixes = إصلاحات معدل الإطارات
At 60 and 120 fps: physics, capes and hair, cutscene shakes, map markers, menu animations and dialogue typing that count frames move at their 30 fps speed. [fefw] frame_fixes_skip in the ini turns single groups off. = عند 60 و120 fps: الفيزياء والعباءات والشعر واهتزازات المشاهد السينمائية وعلامات الخريطة وحركات القوائم وكتابة الحوار التي تُحسب بالإطارات تتحرك بسرعتها عند 30 fps. المفتاح [fefw] frame_fixes_skip في ملف ini يوقف مجموعات بعينها.
